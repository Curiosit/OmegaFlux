[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omegaflux"
version = "0.1.0"
description = "Daylight prediction without neural networks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "xgboost",
    "matplotlib",
    "joblib",
    "onnxmltools",
    "openpyxl"
]

[project.optional-dependencies]
hops = [
    "flask",
    "ghhops-server"
]
dev = [
    "pytest",
    "black",
    "isort",
    "flask",
    "ghhops-server"
]

# Explicitly tell setuptools to find the omegaflux package package
[tool.setuptools.packages.find]
include = ["omegaflux*"]